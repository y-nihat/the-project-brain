# The gate that replaces the pre-push hook once contributions arrive from
# outside this machine. The hook still runs locally; it cannot run on a fork.
#
# Deliberate choices:
#   * `pull_request`, never `pull_request_target` — the latter runs with write
#     permissions and the BASE repo's secrets against a fork's code, which is
#     the standard way CI becomes the supply-chain hole.
#   * every action pinned by commit SHA, not a tag a maintainer can repoint.
#   * the default token is read-only; no job asks for more.
#   * pip-audit is a scheduled job, not a PR gate: a new CVE in a transitive
#     dependency must not turn an unrelated contributor's PR red.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, for the audit job only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current ceiling. The floor had never been
        # executed anywhere before this workflow existed.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline suite
        # No Docker here: the sandbox tests detect that and skip with a reason,
        # which is the honest result rather than a false green.
        run: python -m pytest tests/ -q

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --redact --no-banner --verbose

  audit:
    # Weekly only, and it must stay weekly only. Never blocks a pull request.
    #
    # Do not add `workflow_dispatch` or `pull_request` here. pip-audit's project
    # mode writes the strings from [project.dependencies] verbatim into a pip
    # requirements file, and pip honours `--index-url` / `--extra-index-url`
    # there as global options on their own lines. A `schedule` trigger can only
    # run from the default branch, so those strings are always the reviewed
    # ones; any trigger that lets another ref run this job would let that ref
    # steer the resolver's package index. That sink did not exist while the job
    # audited an already-installed environment. This job's form creates it.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Audit dependencies
        # Audit the project, not the runner's site-packages. Given a project
        # directory, pip-audit resolves [project.dependencies] in a throwaway
        # virtualenv and audits the whole transitive closure, not just the names
        # declared in pyproject.toml.
        #
        # The previous form ran `pip install -e .` first and audited whatever the
        # runner happened to be holding. That put the-project-brain into its own
        # audit set: the package is unpublished, PyPI answers 404 for it, and
        # `--strict` fails the run on any dependency it cannot resolve. The job
        # died on its own name and never once reached a verdict. It also audited
        # pip-audit's own dependency tree, which is the scanner's supply chain
        # and not this project's.
        #
        # `--strict` stays, but not because resolution failures need it: an
        # unsatisfiable range already exits non-zero without it. It stays because
        # it is the guard that stops this exact defect from returning through a
        # `git+https://`, `file://` or private-index entry in
        # [project.dependencies] — something that installs but has no PyPI record.
        #
        # Not audited, deliberately: [project.optional-dependencies].dev, which
        # the `tests` job in this same file does install, and the pinned set in
        # uv.lock. Ranges are re-resolved on every run, so a green Monday is a
        # statement about what resolves that morning, not about what any user or
        # any built image has installed.
        #
        # The scanner is version-bounded on purpose. Advisory data is fetched
        # live at run time, so a bound costs no freshness, while an unbounded
        # scanner in a workflow whose header insists on pinning everything was
        # the odd one out — and this job's scope, not merely its findings, is now
        # decided by the project-mode code path.
        #
        # The coverage floor below is not decoration. Project mode derives the
        # entire audit set from one TOML key: empty [project.dependencies], or
        # the same names moved behind `dynamic` or a PEP 735 dependency group,
        # and pip-audit audits zero packages, prints "No known vulnerabilities
        # found" and exits 0. A clean run prints no package list, so that
        # collapse is byte-identical to a real pass. Nothing else in CI validates
        # that key, and this repo already uses `dynamic` for the version.
        run: |
          python -m pip install --upgrade pip 'pip-audit~=2.10'
          REPORT="${RUNNER_TEMP}/pip-audit.json"
          rc=0
          pip-audit --strict --format json --output "$REPORT" . || rc=$?
          python - "$rc" "$REPORT" <<'PY'
          import json
          import sys

          rc, path = int(sys.argv[1]), sys.argv[2]
          try:
              with open(path, encoding="utf-8") as fh:
                  report = json.load(fh)
          except (OSError, ValueError):
              # pip-audit died before writing a report: unsatisfiable range,
              # index outage, malformed pyproject. Its own message is the
              # diagnosis; do not second-guess it, just carry the code out.
              print(f"audit: no report written; deferring to pip-audit exit {rc}")
              sys.exit(rc or 1)

          deps = report.get("dependencies", [])
          print(f"audit: {len(deps)} packages resolved and queried")
          for dep in sorted(deps, key=lambda d: d["name"].lower()):
              print(f"  {dep['name']} {dep.get('version', '')}")
              for vuln in dep.get("vulns", []):
                  fixes = ", ".join(vuln.get("fix_versions") or []) or "none"
                  print(f"    VULN {vuln['id']}  fix: {fixes}")

          # A floor, not a target: the closure is 44 packages today.
          FLOOR = 20
          if len(deps) < FLOOR:
              print(
                  f"audit: COVERAGE COLLAPSE - {len(deps)} packages audited, "
                  f"expected at least {FLOOR}. Check [project.dependencies] "
                  f"in pyproject.toml."
              )
              sys.exit(1)

          sys.exit(rc)
          PY
