[project]
name = "the-project-brain"
version = "0.0.1"
description = "A self-organizing agent brain on the Claude Agent SDK."
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brain", "brain.sandbox", "brain.capabilities", "brain.memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
