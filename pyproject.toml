[project]
name = "the-project-brain"
# ONE version source. `brain.config.ENGINE_VERSION` is stamped onto every
# traced run and into every capability's validation epoch, so it is the version
# that already has consequences; a second, hand-maintained number here drifted
# to 0.0.1 while the engine shipped 0.27.0. Read statically (a plain literal
# assignment), so building never imports the package.
dynamic = ["version"]
description = "A self-organizing agent brain on the Claude Agent SDK."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "CLA.md"]
authors = [{ name = "Nihat Uzunalioglu" }]
keywords = ["agents", "orchestration", "claude", "sandbox", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/y-nihat/the-project-brain"
Repository = "https://github.com/y-nihat/the-project-brain"
Changelog = "https://github.com/y-nihat/the-project-brain/blob/main/CHANGELOG.md"
Issues = "https://github.com/y-nihat/the-project-brain/issues"

[project.scripts]
# The host-side entry point M2 calls for. `brain.main:main` already parses
# argv and exits with the run's status.
brain = "brain.main:main"

[build-system]
# >=77 for PEP 639: the SPDX `license` string and `license-files`. An older
# setuptools silently drops both, and a wheel with no license is the one
# packaging defect that cannot be repaired for whoever already installed it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "brain.config.ENGINE_VERSION" }

# DISCOVERY, not an enumeration. The hand-listed form omitted
# `brain.observability` and `brain.evals` — and `brain/session.py` imports
# observability at module load, so an installed distribution raised
# ImportError on first use. This repo adds subpackages faster than anyone
# edits this file; a pattern cannot fall behind.
[tool.setuptools.packages.find]
include = ["brain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Outside the tree. The documented way to run this suite is inside the brain
# container, where /app is mounted READ-ONLY — pytest's default `.pytest_cache`
# in the rootdir would make the documented command fail on a permission error.
cache_dir = "/tmp/.pytest_cache"
# Collect ONLY the engine's own suite. Without this, a bare `pytest` from the
# repo root walks data/ — the git-ignored RUN OUTPUT tree — and collects test
# files that agents authored and tools extracted during past runs. That both
# breaks the documented `pytest` command (unimportable modules => collection
# errors) and violates the project's central safety property: agent-generated
# code must never execute on the host, only in a sandbox container.
testpaths = ["tests"]
norecursedirs = ["data", ".venv", ".git", "docker", "scripts", "*.egg-info"]
