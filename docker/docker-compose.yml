# Brain + a whitelisted Docker socket-proxy.
#
# The brain NEVER mounts the raw docker socket. It reaches the daemon only
# through `docker-socket-proxy`, which exposes just the API groups the brain
# needs (containers/images/build/networks/volumes) and only because POST=1 is
# set. Everything else (exec, secrets, swarm, host info, auth) stays denied.
#
# Honest caveat: controlling container creation is still powerful. The proxy
# shrinks the blast radius; it does not make the brain harmless.

services:
  docker-socket-proxy:
    # PINNED BY DIGEST. This is the one container holding the raw docker socket,
    # so a mutable tag makes an upstream repoint host root on every user's
    # machine at their next `up --build`.
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      POST: 1          # master switch: allow write operations on enabled groups
      CONTAINERS: 1    # create / start / stop / inspect / remove sandbox containers
      IMAGES: 1        # inspect / pull base images
      BUILD: 1         # build capability images from streamed contexts
      # NETWORKS and VOLUMES were enabled for a use that never arrived: the
      # engine only ever calls containers.create with a predefined
      # `network_mode`, which is CONTAINERS, and creates no networks or volumes
      # at all. Two write-capable API groups on the most dangerous container in
      # the topology, for nothing. Removed — restore one only alongside the code
      # that needs it.
      # Explicitly denied (default 0): NETWORKS, VOLUMES, EXEC, AUTH, SECRETS,
      # SWARM, SYSTEM, INFO, CONFIGS, NODES, PLUGINS, SERVICES, TASKS, SESSION.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # haproxy measures ~15MiB in use; 64m hard cap (no swap) is 4x headroom.
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    networks: [brainnet]

  brain:
    build:
      context: ..
      dockerfile: docker/brain.Dockerfile
    depends_on: [docker-socket-proxy]
    # Run as the HOST user so everything the brain writes under the bind-mounted
    # data/ is host-owned (no root-owned run folders, inbox, or capability
    # library the user cannot read/delete). Defaults to 1000:1000; override via
    # BRAIN_UID/BRAIN_GID in .env if your host ids differ. Also drops root in
    # the container — defense in depth.
    user: "${BRAIN_UID:-1000}:${BRAIN_GID:-1000}"
    # SECURITY: no blanket env_file. Only the ALLOWLISTED variables below enter
    # the container — anything else a user adds to .env stays on the host.
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set it in .env}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SANDBOX_BASE_IMAGE: ${SANDBOX_BASE_IMAGE:-python:3.12-slim}
      BRAIN_MODEL: ${BRAIN_MODEL:-}
      BRAIN_MODEL_STRONG: ${BRAIN_MODEL_STRONG:-}
      BRAIN_MODEL_FAST: ${BRAIN_MODEL_FAST:-}
      # The claude CLI needs a writable HOME; the container HOME (/root or unset)
      # is not writable for an arbitrary uid. /tmp always is.
      HOME: /tmp
    working_dir: /app
    # The orchestrator holds the credential and reaches the whole Docker API
    # through the proxy, and it was the least-hardened container in this file.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # READ-ONLY source. The engine only ever READS under /app — every write
      # goes to data/, which is mounted rw on top. A defect that wrote outside a
      # run folder used to land in the repo itself (including .git), because the
      # whole tree was writable for no reason.
      - ..:/app:ro
      - ../data:/app/data:rw         # the one writable path: run output, DB, library
      - /dev/null:/app/.env:ro       # mask the host .env file inside the container:
                                     # the allowlisted env vars above are the only delivery path
      - /etc/localtime:/etc/localtime:ro   # container clock renders in the laptop's timezone
      - /etc/timezone:/etc/timezone:ro
    # Idle the brain is ~MBs, but a live run holds several concurrent agent
    # CLI subprocesses plus image builds — peaks are GBs, so the ceiling stays
    # 2g. memswap==mem makes it a HARD cap (no silent spill into swap), same
    # policy the sandboxes get.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    networks: [brainnet]
    stdin_open: true                 # interactive approval gate reads stdin
    tty: true
    command: ["sleep", "infinity"]   # run commands with `docker compose exec brain ...`

  # Optional interactive trace viewer (Arize Phoenix). Opt-in via profile:
  #   docker compose -f docker/docker-compose.yml --profile observability up -d phoenix
  # The brain's SQLite remains the source of truth; runs are pushed to Phoenix
  # with `python -m brain.observability export ...`. Traces persist under
  # data/phoenix (host bind-mount), so the viewer can be stopped anytime.
  phoenix:
    image: arizephoenix/phoenix:19.7.0@sha256:890ec498f4e37d8b2d2f1a81bd102b11f0739a7eb48158e9cf61c6b8821de395
    profiles: ["observability"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      # LOOPBACK ONLY. This UI has no authentication and shows every exported
      # run — objectives, agent prompts, tool output. Published on 0.0.0.0 it
      # was the only port this project opened, and it opened it to the network.
      - "127.0.0.1:6006:6006"     # UI + OTLP HTTP collector (/v1/traces)
    volumes:
      - ../data/phoenix:/mnt/data
    # Phoenix sits at ~400MiB with today's trace volume and grows with it;
    # 1g hard-capped is the honest floor, not generosity.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    networks: [brainnet]

networks:
  brainnet:
    driver: bridge
